esult",population:"Indian adults 20+, national sample",caveat:"Cross-sectional; 'metabolic obesity' = 2+ risk factors.",relevance:5,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C2",finding:"Only 26.6% were both normal-BMI and metabolically healthy; 28.3% had both high BMI and metabolic problems.",quote:"The prevalence of various obesity subtypes was as follows: MONO: 43.3 per cent [95% confidence interval (CI): 42.6-44%], MOO: 28.3 per cent (27.7-28.9%), MHNO: 26.6 per cent (26-27.2%), and MHO: 1.8 per cent (1.6-2%).",location:"p3",numbers:["26.6","28.3"],type:"result",population:"Indian adults",caveat:"",relevance:5,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C3",finding:"Metabolic obesity here means 2 or more of: waist ≥90 cm (men) / ≥80 cm (women), fasting sugar ≥100, BP ≥130/85, triglycerides ≥150, or low HDL.",quote:"Metabolic obesity was defined as having ≥2 components of metabolic syndrome: (i) waist circumference ≥90 cm in males and ≥80 cm, in females, (ii) fasting blood glucose (FBG) ≥100 mg/dl, (iii) BP ≥130/85 mmHg or on anti-hypertensive medications, (iv) serum triglyceride levels ≥150 mg/dl or (v) HDL cholesterol <40 mg/dl for males and <50 mg/dl for females.",location:"p13",numbers:["90","80","100","130","85","150"],type:"definition",population:"Study definition",caveat:"",relevance:5,steer_theme:"eligibility",verified:!0,problems:[]},{id:"C4",finding:"This 'thin-outside, unhealthy-inside' group had about 6.9 times the odds of type 2 diabetes compared with the healthy normal-weight group.",quote:"The risk of T2D was highest in MOO [Odds ratio (OR)=12.89; 95% CI: 9.54-17.43; P<0.001], especially among females, followed by MONO (OR=6.90; 95% CI: 5.10-9.34; P<0.001) after adjusting for confounders.",location:"p29",numbers:["6.9","12.89"],type:"result",population:"Blood-tested subsample",caveat:"Odds ratios from a cross-sectional survey, not lifetime risk.",relevance:5,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C5",finding:"Indians tend to develop type 2 diabetes and related problems at a lower BMI than other ethnic groups.",quote:"Compared to other ethnicities, Asian Indians have a distinct susceptibility to develop T2D and other obesity-related metabolic disorders at a lower BMI.",location:"p5",numbers:[],type:"background",population:"Asian Indians",caveat:"Background statement citing earlier studies.",relevance:5,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C6",finding:"A normal BMI can hide excess body fat; waist-based measures predict risk better.",quote:"Therefore, a normal BMI may conceal the presence of excess body fat. WC, WHR, and WHtR are considered better predictors of health risks associated with obesity than BMI, as they provide information on fat distribution and central adiposity.",location:"p32",numbers:[],type:"background",population:"General",caveat:"",relevance:5,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C7",finding:"More than a third of people even in their 20s were in this group.",quote:"Our findings that more than a third of individuals, even in the 20-29 yr age group, had MONO is a concerning trend given the long-term health risks associated with metabolic dysfunction.",location:"p35",numbers:["20"],type:"result",population:"Adults 20–29",caveat:"",relevance:4,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C8",finding:"Simple checks like waist measurement and BP can catch this early; BMI alone misses it.",quote:"While diagnostic tests like insulin resistance assessments and detailed lipid panels are available to identify individuals at risk, simpler and more accessible screening tools, such as WC, WHR, WHtR, and BP measurements, can help detect this unfavourable phenotype early.",location:"p37",numbers:[],type:"result",population:"",caveat:"Authors' recommendation.",relevance:5,steer_theme:"habits",verified:!0,problems:[]},{id:"C9",finding:"Low HDL ('good' cholesterol) was the most common component, seen in 79.2%, followed by BP at 69.5%.",quote:"Among the five components of metabolic obesity, HDL-C had the highest contribution (79.2%; 95% CI: 78.5-79.9%), followed by BP (69.5%; 95% CI: 68.7-70.2%), fasting blood glucose (57.7%; 95% CI: 56.9-58.6%), WC (55.7%; 95% CI: 54.9-56.6%), and triglycerides (42.8%; 95% CI: 42-43.7%).",location:"p23",numbers:["79.2%","69.5%"],type:"result",population:"People with metabolic obesity",caveat:"",relevance:3,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C10",finding:"MONO was the most common type in every State, from 34.8% in Delhi to 56.7% in Tripura.",quote:"MONO was the most common subtype in all States, with prevalence ranging from 34.8 per cent (95% CI: 27.7-41.9%) in Delhi to 56.7 per cent (95% CI: 52.6-60.8%) in Tripura.",location:"p23",numbers:["34.8","56.7"],type:"result",population:"State-level",caveat:"",relevance:3,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C11",finding:"Limitation: a one-time survey, so it can't show cause and effect.",quote:"Some of the limitations of our study include the fact that it is cross-sectional, which prevents us from assessing causal implications or looking at long-term outcomes.",location:"p38",numbers:[],type:"limitation",population:"",caveat:"",relevance:4,steer_theme:"other",verified:!0,problems:[]}],dropped:[],timing:[{step:"ingest",seconds:0},{step:"extract",seconds:0},{step:"verify",seconds:0},{step:"create-carousel",seconds:0},{step:"render-carousel",seconds:3.7}]},{key:"step1-ext",meta:{title:"Weight regain and cardiometabolic effects after withdrawal of semaglutide: The STEP 1 trial extension",journal:"Diabetes, Obesity & Metabolism",year:"2022",doi:"10.1111/dom.14725",pmcid:"PMC9542252",authors:["Wilding John P. H.","Batterham Rachel L.","Davies Melanie","Van Gaal Luc F.","Kandler Kristian","Konakli Katerina"],source:"europepmc",license:"CC BY 4.0",design:"Off-treatment observational extension of a randomised, double-blind, placebo-controlled trial (exploratory analyses)",population:"327 adults with obesity (or overweight plus a weight-related condition), without diabetes, from Canada, Germany, Japan, the UK and the US; 67% female, 75.8% White, mean age 49",funding_or_coi:"Several authors employed by / own stock in Novo Nordisk, the drug's manufacturer"},claims:[{id:"C1",finding:"One year after stopping the weekly GLP-1 injection and the lifestyle programme, people regained about two-thirds of the weight they had lost.",quote:"One year after withdrawal of once‐weekly subcutaneous semaglutide 2.4 mg and lifestyle intervention, participants regained two‐thirds of their prior weight loss, with similar changes in cardiometabolic variables.",location:"p4",numbers:["2.4"],type:"result",population:"327 adults with obesity, no diabetes, 5 high-income countries",caveat:"Lifestyle support was also stopped; does not show what happens if habits are kept up.",relevance:5,steer_theme:"regain",verified:!0,problems:[]},{id:"C2",finding:"During 68 weeks of treatment, average weight loss was 17.3% on the medicine vs 2.0% on placebo.",quote:"From week 0 to week 68, mean weight loss was 17.3% (SD: 9.3%) with semaglutide and 2.0% (SD: 6.1%) with placebo.",location:"p3",numbers:["68","17.3%","2.0%"],type:"result",population:"Extension participants who completed 68 weeks",caveat:"Averages; individual results varied widely (SD 9.3%). Only people who completed treatment were included.",relevance:4,steer_theme:"regain",verified:!0,problems:[]},{id:"C3",finding:"After stopping, people regained 11.6 percentage points by week 120, leaving a net loss of 5.6% from where they started.",quote:"Following treatment withdrawal, semaglutide and placebo participants regained 11.6 (SD: 7.7) and 1.9 (SD: 4.8) percentage points of lost weight, respectively, by week 120, resulting in net losses of 5.6% (SD: 8.9%) and 0.1% (SD: 5.8%), respectively, from week 0 to week 120.",location:"p3",numbers:["11.6","120","5.6%"],type:"result",population:"327 extension participants",caveat:"Follow-up was one year off treatment; longer-term trajectory unknown.",relevance:5,steer_theme:"regain",verified:!0,problems:[]},{id:"C4",finding:"At week 120, 48.2% of the medicine group still kept off at least 5% of their starting weight, compared with 22.6% on placebo.",quote:"At week 120, 5% or higher weight loss from baseline was observed in 48.2% of participants (95 of 197) in the semaglutide arm and in 22.6% (21 of 93) in the placebo arm.",location:"p24",numbers:["120","5%","48.2%","22.6%"],type:"result",population:"290 participants with week-120 site data",caveat:"Down from 86.4% at the end of treatment.",relevance:4,steer_theme:"regain",verified:!0,problems:[]},{id:"C5",finding:"The share keeping off at least 5% fell from 86.4% at the end of treatment to 48.2% a year after stopping.",quote:"Almost half of the participants in the semaglutide arm (48.2%) still had clinically meaningful weight loss of 5% or more from baseline at week 120, although this proportion represented a substantial fall from that originally achieved at the end of 68 weeks of treatment (86.4%).",location:"p35",numbers:["48.2%","86.4%"],type:"result",population:"Medicine arm of the extension",caveat:"Exploratory analysis; no significance testing.",relevance:4,steer_theme:"regain",verified:!0,problems:[]},{id:"C6",finding:"Blood pressure and most heart-health markers that improved during treatment drifted back towards starting levels after stopping.",quote:"Cardiometabolic improvements seen from week 0 to week 68 with semaglutide reverted towards baseline at week 120 for most variables.",location:"p3",numbers:["68","120"],type:"result",population:"327 extension participants",caveat:"Some markers (CRP, some lipids) stayed slightly better than baseline.",relevance:4,steer_theme:"regain",verified:!0,problems:[]},{id:"C7",finding:"Among people with prediabetes, 93.6% had normal blood sugar at the end of treatment; a year after stopping this was 43.3% (vs 34.0% on placebo).",quote:"Among participants with prediabetes at baseline, numerically more participants reverted to normoglycaemia at week 68 with semaglutide than placebo (93.6% vs. 41.5%; Figure 3). After treatment withdrawal, improvements deteriorated in both arms. Although the deterioration was larger in the semaglutide arm, a relative improvement was maintained versus the placebo arm at week 120, with reversion to normoglycaemia in 43.3% versus 34.0% of participants with baseline prediabetes in the semaglutide and placebo arms, respectively.",location:"p33",numbers:["93.6%","43.3%","34.0%"],type:"result",population:"Participants with prediabetes at baseline (59.6% of the sample)",caveat:"Exploratory; not powered for this outcome.",relevance:4,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C8",finding:"The authors say the results show obesity is a long-term (chronic) condition and that ongoing treatment is needed to keep the benefits.",quote:"Findings confirm the chronicity of obesity and suggest ongoing treatment is required to maintain improvements in weight and health.",location:"p4",numbers:[],type:"result",population:"Adults with obesity in the trial",caveat:"Authors' interpretation; several authors are employed by the manufacturer.",relevance:5,steer_theme:"regain",verified:!0,problems:[]},{id:"C9",finding:"After weight loss, the body triggers biological changes that push weight back up, so regain is common.",quote:"Weight loss activates compensatory biological changes that prevent the maintenance of long‐term weight loss 8 , 9 ; weight regain is common.",location:"p6",numbers:[],type:"background",population:"People with obesity (general background)",caveat:"Background statement citing other studies, not a result of this trial.",relevance:5,steer_theme:"hunger",verified:!0,problems:[]},{id:"C10",finding:"The lifestyle programme during treatment was a 500 kcal/day deficit plus 150 minutes of activity a week, with counselling every 4 weeks.",quote:"The lifestyle intervention consisted of counselling every 4 weeks on diet (500 kcal deficit per day relative to total estimated energy expenditure at randomization) and physical activity (150 minutes per week).",location:"p9",numbers:["500","150"],type:"method",population:"All STEP 1 participants",caveat:"This support stopped at week 68; the trial does not test continued habits after stopping.",relevance:3,steer_theme:"habits",verified:!0,problems:[]},{id:"C11",finding:"Unlike other withdrawal trials, there was no structured lifestyle support after stopping, which the authors say may have contributed to regain.",quote:"Furthermore, the absence of structured lifestyle intervention following semaglutide withdrawal contrasts with the continuation of lifestyle intervention in other withdrawal trials (including in STEP 4) 13 , 14 , 15 and may also have contributed to the trajectory of weight regain.",location:"p37",numbers:["4"],type:"limitation",population:"Extension participants",caveat:"Hypothesis by the authors; not tested.",relevance:5,steer_theme:"habits",verified:!0,problems:[]},{id:"C12",finding:"People who lost the most weight regained the most, but still ended up with the biggest net loss.",quote:"Subgroups with greater weight losses from week 0 to week 68 tended to have numerically greater weight regains from week 68 to week 120, but maintained numerically greater net weight losses from week 0 to week 120 (Figure 1B and Table S3).",location:"p27",numbers:["68","120"],type:"result",population:"Medicine arm, by weight-loss subgroup",caveat:"Subgroup, exploratory.",relevance:3,steer_theme:"regain",verified:!0,problems:[]},{id:"C13",finding:"Most participants were women (67.0%) and White (75.8%), average age 49.",quote:"Most participants were female (67.0%) and White (75.8%), with a mean age of 49.0 years, weight of 105.5 kg and BMI of 37.6 kg/m2.",location:"p23",numbers:["67.0%","75.8%","49.0"],type:"definition",population:"Extension analysis set",caveat:"No South Asian sub-group; Indian bodies carry risk at 2h.",location:"p1",numbers:[],type:"result",population:"Healthy UK/US adults without diabetes",caveat:"Association, not proof that the dip causes hunger.",relevance:5,steer_theme:"hunger",verified:!0,problems:[]},{id:"C2",finding:"People with the biggest dips ate about 312 kcal more over the next 24 hours than people with the smallest dips.",quote:"The participants with the largest average Glucose Dip2-3h (Q4) also had on average a +9%; (95% CI 5,13) increase in reported Hunger2-3h, a -2% (95% CI 1,5) decrease in Alertness level2-3h, a -24 minutes (95% CI 15,33) shorter time until the next meal, a +75 kcal (95% CI 47,103) higher Energy intake3-4h, and a +312 kcal (95% CI 226,398) higher overall Energy intake24h, compared to the participants with the smallest Glucose Dip2-3h (Q1).",location:"p46",numbers:["312","24"],type:"result",population:"763 UK participants who ate all 5 core breakfasts",caveat:"Comparison of top vs bottom quarter of dippers; self-reported food logs.",relevance:5,steer_theme:"hunger",verified:!0,problems:[]},{id:"C3",finding:"Big dippers reached for their next meal about 24 minutes sooner and felt 9% hungrier.",quote:"The participants with the largest average Glucose Dip2-3h (Q4) also had on average a +9%; (95% CI 5,13) increase in reported Hunger2-3h, a -2% (95% CI 1,5) decrease in Alertness level2-3h, a -24 minutes (95% CI 15,33) shorter time until the next meal",location:"p46",numbers:["24","9%"],type:"result",population:"763 UK participants",caveat:"Average differences between groups; individuals vary.",relevance:4,steer_theme:"hunger",verified:!0,problems:[]},{id:"C4",finding:"The study tracked 1070 people eating 8,624 standard breakfasts and 71,715 everyday meals with glucose monitors.",quote:"We explore the link between postprandial glucose, appetite, and subsequent energy intake in 1070 participants from a UK discovery and US validation cohort, consuming 8,624 standardised meals followed by 71,715 ad libitum meals, using continuous glucose monitors to record postprandial glycemia.",location:"p1",numbers:["1070","8,624","71,715"],type:"method",population:"UK + US adults",caveat:"",relevance:3,steer_theme:"other",verified:!0,problems:[]},{id:"C5",finding:"The same person eating the same meal on different days still ate more after the days with a bigger dip.",quote:"Even when holding constant both the food and the individual, Glucose Dips2-3h were modestly but significantly correlated with time until next meal (r=-0.06 P=<0.001), Energy intake3-4h (r=0.08 P=<0.001), and Energy intake24h (r=0.06 P=<0.001).",location:"p51",numbers:[],type:"result",population:"1053 participants, repeated meals",caveat:"Correlations are small (r≈0.06–0.08).",relevance:4,steer_theme:"hunger",verified:!0,problems:[]},{id:"C6",finding:"The biggest dips came after the meal with the biggest sugar spike (a glucose drink).",quote:"Between the standardised meals, the largest glucose dips followed the meal with the largest glucose rise (OGTT).",location:"p57",numbers:[],type:"result",population:"Study participants",caveat:"OGTT is a pure glucose drink, not a normal meal.",relevance:4,steer_theme:"habits",verified:!0,problems:[]},{id:"C7",finding:"The authors suggest high-glycaemic foods like potatoes and sugary drinks could lead to dips and later hunger.",quote:"Our analysis may partly explain why observational epidemiological ((27)(28)) studies have shown strong correlations between foods with high glycemic loads (such as potatoes and sugar sweetened beverages (29)) and weight gain – as consumption of such foods could lead to glucose dips and subsequent hunger.",location:"p57",numbers:[],type:"result",population:"Authors' interpretation",caveat:"Hypothesis ('may partly explain'), not tested in this study.",relevance:4,steer_theme:"habits",verified:!0,problems:[]},{id:"C8",finding:"Hunger after dieting is a known reason weight comes back.",quote:"In addition to decreases in resting energy expenditure (5) there is also considerable evidence for increases in postprandial appetite following hypocaloric diets and caloric restriction (e.g. (6),(7),(8)).",location:"p3",numbers:[],type:"background",population:"General background",caveat:"Background citing other studies.",relevance:4,steer_theme:"hunger",verified:!0,problems:[]},{id:"C9",finding:"The link is real but small: glucose dips are only one part of why we eat.",quote:"The decision to eat is determined by many social, psychological and physiological factors, and glucose dips are just one part of the picture.",location:"p58",numbers:[],type:"limitation",population:"",caveat:"",relevance:5,steer_theme:"hunger",verified:!0,problems:[]},{id:"C10",finding:"Participants were 97% white, so results may not apply directly to Indian bodies and diets.",quote:"In addition, there was limited ethnic diversity in our study population (97% white).",location:"p59",numbers:["97%"],type:"limitation",population:"Study sample",caveat:"No South Asian data.",relevance:5,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C11",finding:"The dip predicted later eating about as well as people's own hunger ratings.",quote:"It is notable that the Glucose Dip2-3h was as good a predictor of subsequent energy intake as the participants’ self-reported Hunger2-3h.",location:"p55",numbers:[],type:"result",population:"UK cohort",caveat:"",relevance:3,steer_theme:"hunger",verified:!0,problems:[]}],dropped:[],timing:[{step:"ingest",seconds:0},{step:"extract",seconds:0},{step:"verify",seconds:0},{step:"create-static",seconds:0},{step:"render-static",seconds:1.9}]},{key:"misra-definition",meta:{title:"Revised definition of obesity in Asian Indians living in India",journal:"Diabetes & Metabolic Syndrome: Clinical Research & Reviews",year:"2025",doi:"10.1016/j.dsx.2024.102989",authors:["Anoop Misra","Naval K. Vikram","Amerta Ghosh","Piyush Ranjan","Seema Gulati"],source:"pdf",file:"paper-misra2025-india-obesity.pdf",design:"Expert consensus guideline (5-round Delphi process) with literature review",population:"Asian Indians living in India (adults)",funding_or_coi:"Not extracted from the PDF text; check the paper's declarations"},claims:[{id:"C2",finding:"Stage 1 obesity: BMI above 23 with extra body fat but no effect yet on organ function or daily activities.",quote:"Results: In Stage 1 Obesity, individuals exhibit increased adiposity (BMI>23 kg/m2) without discernible effects on organ functions or daily activities.",location:"page 1 ¶3",numbers:["23"],type:"definition",population:"Asian Indians in India",caveat:"Expert consensus, not a trial result.",relevance:5,steer_theme:"eligibility",verified:!0,problems:[]},{id:"C3",finding:"Stage 2 obesity needs BMI above 23 plus a high waist or waist-to-height ratio.",quote:"The criteria for Stage 2 Obesity include a mandatory BMI exceeding 23 kg/m2 and at least one of the following: excess waist circumference or waist-to-height ratio.",location:"page 1 ¶4",numbers:["23"],type:"definition",population:"Asian Indians in India",caveat:"",relevance:5,steer_theme:"eligibility",verified:!0,problems:[]},{id:"C4",finding:"Stage 2 also needs at least one sign of daily-life limitation or an obesity-related disease.",quote:"Additionally, the presence of one or more symptoms indicative of limitations in daily activities or one or more obesity-related comorbid conditions/diseases are needed to support the stage 2 obesity.",location:"page 1 ¶4",numbers:[],type:"definition",population:"Asian Indians in India",caveat:"",relevance:5,steer_theme:"eligibility",verified:!0,problems:[]},{id:"C5",finding:"Abdominal obesity cut-offs: waist 90 cm or more in men, 80 cm or more in women; waist-to-height ratio above 0.5.",quote:"a. WC Cutoffs level: WC ≥90 cm in men and ≥80 cm in women [10]. b. W-HtR cutoff level: >0.5 [70].",location:"page 7 ¶4",numbers:["90","80","0.5"],type:"definition",population:"Asian Indian adults",caveat:"",relevance:5,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C6",finding:"BMI can't tell muscle from fat or bone, and varies with age, sex and ethnicity.",quote:"However, one of the key limitations of BMI is that it varies with age, sex, ethnicity, and physical conditioning. Further, it cannot distinguish between bone density, muscle mass, and body fat [6].",location:"page 4 ¶1",numbers:[],type:"background",population:"General",caveat:"",relevance:5,steer_theme:"muscle",verified:!0,problems:[]},{id:"C7",finding:"In national Indian survey data, BMI and diabetes were linked beyond a BMI of 21.8.",quote:"After accounting for factors such as age, gender, caste, area, and survey round, a positive correlation was discovered between BMI and diabetes, beyond a BMI of 21.8 kg/m2 [37].",location:"page 4 ¶1",numbers:["21.8"],type:"background",population:"Indian national survey data (IHDS, DHS), cited study",caveat:"Correlation from a cited study, not this paper's own data.",relevance:5,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C8",finding:"Asian Indians show more disease at smaller waist sizes than white Caucasians.",quote:"Asian Indians, in particular, have higher morbidity rates at lower WC cutoff points than white Caucasians [30].",location:"page 3 ¶7",numbers:[],type:"background",population:"Asian Indians vs white Caucasians",caveat:"Cited evidence.",relevance:5,steer_theme:"india-risk",verified:!0,problems:[]},{id:"C9",finding:"Daily-life signs include breathlessness, palpitations and lower-limb joint pain during everyday activities.",quote:"Clinical findings such as shortness of breath, palpitations, (indicating obesity related impairment of lungs and heart) and musculoskeletal symptoms like pain of joints of lower limbs (obesity related impairment of weight bearing joints) on doing activities within the house, bathing, dressing, toileting, eating, etc.",location:"page 7 ¶2",numbers:[],type:"definition",population:"",caveat:"",relevance:4,steer_theme:"eligibility",verified:!0,problems:[]},{id:"C10",finding:"For Stage 1, nutrition therapy, physical activity and behaviour change are usually enough.",quote:"Lifestyle-related interventions like individualized medical nutrition therapy, physical activity and behavioural intervention should be initiated for obviating risk as seen in stage 2 obesity. In people with stage 1 obesity these measures would usually be sufficient.",location:"page 7 ¶7",numbers:["1"],type:"result",population:"People with Stage 1 obesity",caveat:"Guideline recommendation.",relevance:5,steer_theme:"habits",verified:!0,problems:[]},{id:"C11",finding:"Waist is measured with a non-stretch tape, horizontally, just above the hip bone, after breathing out normally.",quote:"Waist circumference is measured with a non-stretchable flexible tape in the horizontal position, just above the iliac crest at the end of normal expiration [41,42].",location:"page 5 ¶9",numbers:[],type:"method",population:"",caveat:"",relevance:4,steer_theme:"habits",verified:!0,problems:[]},{id:"C12",finding:"The definition came from expert consensus in a five-round Delphi process.",quote:"Method: In a Delphi process focused on obesity in India, experts were invited via email to participate in five rounds.",location:"page 1 ¶3",numbers:[],type:"method",population:"Indian experts",caveat:"Expert opinion, not outcome data.",relevance:3,steer_theme:"other",verified:!0,problems:[]}],dropped:[{id:"C1",finding:"India's 2009 obesity guidelines used only BMI; this 2025 consensus redefines obesity for Asian Indians.",quote:"Aim: The prevailing guidelines for obesity in Asian Indians, published in 2009, relied solely on body mass index (BMI) criteria.",location:"page 1 ¶3",numbers:["2009"],type:"background",population:"Asian Indians",caveat:"",relevance:4,steer_theme:"india-risk",verified:!1,problems:["numbers not in quote: ['2025']"]}],timing:[{step:"ingest",seconds:.4},{step:"extract",seconds:0},{step:"verify",seconds:0},{step:"create-carousel",seconds:0},{step:"render-carousel",seconds:3.3}]}],posts:[{paper:"indiab-mono",format:"carousel",files:["indiab-mono/carousel/carousel_en_01.png","indiab-mono/carousel/carousel_en_02.png","indiab-mono/carousel/carousel_en_03.png","indiab-mono/carousel/carousel_en_04.png","indiab-mono/carousel/carousel_en_05.png","indiab-mono/carousel/carousel_en_06.png","indiab-mono/carousel/carousel_en_07.png","indiab-mono/carousel/carousel_en_08.png","indiab-mono/carousel/carousel_hi_01.png","indiab-mono/carousel/carousel_hi_02.png","indiab-mono/carousel/carousel_hi_03.png","indiab-mono/carousel/carousel_hi_04.png","indiab-mono/carousel/carousel_hi_05.png","indiab-mono/carousel/carousel_hi_06.png","indiab-mono/carousel/carousel_hi_07.png","indiab-mono/carousel/carousel_hi_08.png"],package:{format:"carousel",message:"In India, a 'normal' BMI doesn't mean metabolically healthy — check your waist, BP and sugar, not just the scale.",reasoning:"Our research found 'I'm not fat, so this isn't for me' and 'BMI says normal' as common blind spots. This national ICMR study shows the biggest group of Indian adults is normal-BMI but metabolically unhealthy, with higher diabetes odds. It turns a scary number into one simple action (measure waist, check BP/sugar) and positions steer as the place for a doctor-led metabolic check — without promoting any medicine.",en:{slides:[{type:"cover",kicker:"ICMR national study, 2025",headline:"Normal BMI. Still *at risk?*",sub:"The biggest group of Indian adults looks 'fine' on the scale — but not inside.",swipe:"swipe"},{type:"stat",kicker:"thin outside, unhealthy inside",number:"43.3%",text:"of Indian adults had BMI under 25 but 2 or more metabolic risk factors.",note:"the largest group"},{type:"stat",kicker:"only one in four",number:"26.6%",text:"were both normal-BMI and metabolically healthy.",note:""},{type:"explain",kicker:"why it matters",headline:"Higher *diabetes* odds",body:"This group had about 6.9 times the odds of type 2 diabetes compared with healthy normal-weight adults. More than a third of people in their 20s were already in it.",note:"a snapshot, not a verdict"},{type:"myth",myth:"My BMI is normal, so I'm healthy.",truth:"A normal BMI can hide excess body fat. Waist size predicts risk better than BMI."},{type:"habit",kicker:"the 5 signals the study used",headline:"Check these, not just *weight*",bullets:["Waist: 90 cm+ (men), 80 cm+ (women)","Fasting sugar 100+ or BP 130/85+","Triglycerides 150+ or low HDL"]},{type:"cta",headline:"Know your *metabolic* numbers, not just your weight.",sub:"Talk to a steer doctor about a simple metabolic check."}]},hi:{slides:[{type:"cover",kicker:"ICMR national study, 2025",headline:"BMI normal. Phir bhi *risk?*",sub:"Bharat ke adults ka sabse bada group scale pe 'fine' dikhta hai — andar se nahi.",swipe:"swipe karo"},{type:"stat",kicker:"bahar se patle, andar se unhealthy",number:"43.3%",text:"Indian adults ka BMI 25 se kam tha, par 2 ya zyada metabolic risk factors the.",note:"sabse bada group"},{type:"stat",kicker:"sirf chaar mein ek",number:"26.6%",text:"log hi normal BMI aur metabolically healthy, dono the.",note:""},{type:"explain",kicker:"kyun zaroori hai",headline:"*Diabetes* ke zyada chances",body:"Is group mein type 2 diabetes ke odds healthy normal-weight logon se lagbhag 6.9 guna the. 20 ki umar waalon mein bhi ek-tihaai se zyada isme the.",note:"snapshot hai, faisla nahi"},{type:"myth",myth:"Mera BMI normal hai, toh main healthy hoon.",truth:"Normal BMI extra body fat chhupa sakta hai. Kamar ka naap BMI se behtar risk batata hai."},{type:"habit",kicker:"study ke 5 signals",headline:"Sirf *weight* nahi, ye check karo",bullets:["Kamar: 90 cm+ (purush), 80 cm+ (mahila)","Fasting sugar 100+ ya BP 130/85+","Triglycerides 150+ ya HDL kam"]},{type:"cta",headline:"Sirf weight nahi, apne *metabolic* numbers jaano.",sub:"steer ke doctor se ek simple metabolic check ke baare mein baat karo."}]},caption_en:"\"My BMI is normal, I'm fine\" — maybe not. ICMR's national INDIAB study found 43.3% of Indian adults had a BMI under 25 but two or more metabolic risk factors (big waist, high BP, sugar, triglycerides or low HDL). Only 26.6% were normal-BMI AND metabolically healthy. This group had about 6.9 times the odds of type 2 diabetes vs healthy normal-weight adults.\n\nThe fix starts simple: a measuring tape, a BP check, a fasting sugar test. Note: it's a one-time survey, so it can't prove cause and effect.\n\nSource: Deepa et al., Indian J Med Res 2025 (doi:10.25259/IJMR_328_2025)\nsteerclub.com",caption_hi:'"Mera BMI normal hai, sab theek hai" — shayad nahi. ICMR ki national INDIAB study mein 43.3% Indian adults ka BMI 25 se kam tha, par 2 ya zyada metabolic risk factors the (badi kamar, high BP, sugar, triglycerides ya kam HDL). Sirf 26.6% log normal BMI AUR metabolically healthy the. Is group mein type 2 diabetes ke odds lagbhag 6.9 guna the.\n\nShuruaat simple hai: ek measuring tape, BP check, fasting sugar test. Dhyan rahe: ye ek-baar ka survey hai, cause-effect prove nahi karta.\n\nSource: Deepa et al., Indian J Med Res 2025 (doi:10.25259/IJMR_328_2025)\nsteerclub.com',hashtags:["steerclub","metabolichealth","thinoutsidefatinside","bmi","waistsize","diabetesawareness","indianhealth","icmr","sciencesimplified","hinglish"],alt_text:"Seven-slide carousel. 43.3% of Indian adults had a BMI under 25 but two or more metabolic risk factors; only 26.6% were normal-BMI and metabolically healthy; this group had about 6.9 times the odds of type 2 diabetes. Myth vs fact on BMI, the five signals (waist, sugar, BP, triglycerides, HDL), and an invitation to a doctor-led metabolic check.",claim_map:[{text:"The biggest group of Indian adults looks 'fine' on the scale — but not inside.",claim_ids:["C1"]},{text:"43.3% of Indian adults had BMI under 25 but 2 or more metabolic risk factors.",claim_ids:["C1","C3"]},{text:"26.6% were both normal-BMI and metabolically healthy.",claim_ids:["C2"]},{text:"about 6.9 times the odds of type 2 diabetes compared with healthy normal-weight adults",claim_ids:["C4"]},{text:"More than a third of people in their 20s were already in it.",claim_ids:["C7"]},{text:"A normal BMI can hide excess body fat. Waist size predicts risk better than BMI.",claim_ids:["C6"]},{text:"Waist: 90 cm+ (men), 80 cm+ (women); Fasting sugar 100+ or BP 130/85+; Triglycerides 150+ or low HDL",claim_ids:["C3"]},{text:"a measuring tape, a BP check, a fasting sugar test",claim_ids:["C8"]},{text:"it's a one-time survey, so it can't prove cause and effect",claim_ids:["C11"]}],checks:{issues:[],passed:!0,verified_claims:11,dropped_claims:0}},slot:{date:"2026-10-20",time_ist:"09:30",paper:"indiab-mono",format:"carousel"}},{paper:"step1-ext",format:"reel",files:["step1-ext/reel/reel_hi.mp4","step1-ext/reel/reel_hi_cover.png","step1-ext/reel/reel_hi.srt","step1-ext/reel/en_silent/reel_en.mp4"],package:{format:"reel",message:"Weight coming back after stopping treatment is biology, not failure — so plan for maintenance from day one.",reasoning:"Regain is the #1 fear in our GLP-1 user research ('agar band kiya toh sab wapas?'). This trial answers it honestly: yes, most of it came back when BOTH the medicine and lifestyle support stopped — but not all, and the body's pushback is biological, not a willpower failure. That replaces shame with a plan and points to a doctor-led maintenance conversation, without promoting any drug (CDSCO March 2026).",en:{scenes:[{onscreen:"Stopped the *injection*. Then what?",vo:"What happens a year after people stop a weight-loss injection? A big trial followed them.",visual:"kinetic-text",data:{}},{onscreen:"68 weeks: *17.3%* down",vo:"Over 68 weeks of treatment, people lost 17.3% of their weight on average.",visual:"big-number",data:{number:"17.3%"}},{onscreen:"1 year off: *2/3* came back",vo:"Then the injection and the lifestyle support both stopped. Within a year, about two-thirds came back.",visual:"big-number",data:{number:"2/3"}},{onscreen:"But not *all* of it",vo:"Still, they stayed 5.6% below where they started, and 48.2% kept off at least 5%.",visual:"chart",data:{points:[[0,0,"start","week 0"],[68,-17.3,"-17.3%","week 68"],[120,-5.6,"-5.6%","week 120"]],caption:"Average weight change, treatment group"}},{onscreen:"Your body *pulls back*",vo:"Why? After weight loss, the body triggers changes that push weight back up. Regain is common.",visual:"kinetic-text",data:{}},{onscreen:"Plan the *exit*",vo:"Here, lifestyle support stopped too, which the authors say may have added to the regain.",visual:"habit-list",data:{bullets:["Make a maintenance plan *before* stopping","Keep the lifestyle support going","Keep checking *sugar* and BP"]}},{onscreen:"Your *long-term* plan, with a doctor",vo:"Talk to a steer doctor about a long-term plan that fits you.",visual:"cta",data:{}}]},hi:{scenes:[{onscreen:"Injection *band*. Phir kya?",vo:"Weight-loss injection band karne ke ek saal baad kya hota hai? Ek bade trial ne yahi dekha.",visual:"kinetic-text",data:{}},{onscreen:"68 hafte: *17.3%* kam",vo:"Treatment ke 68 hafton mein, log average 17.3% weight kam kar paaye.",visual:"big-number",data:{number:"17.3%"}},{onscreen:"1 saal baad: *2/3* wapas",vo:"Phir injection aur lifestyle support, dono band. Ek saal mein lagbhag do-tihaai weight wapas aa gaya.",visual:"big-number",data:{number:"2/3"}},{onscreen:"Par *sab* nahi",vo:"Phir bhi, shuruaat se 5.6% kam rahe, aur 48.2% log 5% se zyada kam pe tike rahe.",visual:"chart",data:{points:[[0,0,"start","week 0"],[68,-17.3,"-17.3%","week 68"],[120,-5.6,"-5.6%","week 120"]],caption:"Average weight change, treatment group"}},{onscreen:"Body *wapas* kheenchti hai",vo:"Kyun? Weight kam hone par body khud aise changes karti hai jo weight wapas badhaate hain.",visual:"kinetic-text",data:{}},{onscreen:"Exit ka *plan* banao",vo:"Is trial mein lifestyle support bhi band hua tha, aur authors kehte hain isse regain badh sakta hai.",visual:"habit-list",data:{bullets:["Band karne se *pehle* maintenance plan","Lifestyle support chalu rakho","*Sugar* aur BP check karte raho"]}},{onscreen:"Apna *long-term* plan, doctor ke saath",vo:"steer ke doctor se baat karo, apne liye sahi long-term plan samjho.",visual:"cta",data:{}}]},caption_en:"\"If I stop, will it all come back?\" It's the question we hear most. In the STEP 1 extension, adults stopped a weekly weight-loss injection AND their lifestyle support at week 68. A year later, about two-thirds of the lost weight had returned — but on average they were still 5.6% below where they started, and 48.2% kept off at least 5%.\n\nRegain isn't a willpower failure; after weight loss the body pushes back. So any plan needs an exit plan. Note: most participants were White adults in 5 high-income countries, and several authors work for the manufacturer.\n\nSource: Wilding et al., Diabetes Obes Metab 2022 (doi:10.1111/dom.14725)\nsteerclub.com",caption_hi:'"Band kiya toh sab wapas aa jayega?" — sabse common sawaal. STEP 1 extension mein adults ne week 68 pe weekly weight-loss injection AUR lifestyle support dono band kiye. Ek saal baad lagbhag do-tihaai weight wapas aaya — par average mein woh shuruaat se 5.6% kam the, aur 48.2% ne 5% se zyada kam rakha.\n\nRegain willpower ki haar nahi hai; weight kam hone par body wapas kheenchti hai. Isliye har plan ke saath exit plan zaroori hai. Dhyan rahe: zyada participants White the, 5 ameer deshon se, aur kuch authors manufacturer ke employee hain.\n\nSource: Wilding et al., Diabetes Obes Metab 2022 (doi:10.1111/dom.14725)\nsteerclub.com',hashtags:["steerclub","weightregain","metabolichealth","obesityisachronicdisease","sciencesimplified","indianhealth","healthyindia","doctorled","weightmanagement","hinglish"],alt_text:"Animated reel. Text cards and a line chart: average weight fell 17.3% by week 68 of treatment, then rose to 5.6% below the start by week 120 after treatment and lifestyle support stopped. Ends with an invitation to talk to a steer doctor.",claim_map:[{text:"Over 68 weeks of treatment, people lost 17.3% of their weight on average.",claim_ids:["C2"]},{text:"Then the injection and the lifestyle support both stopped. Within a year, about two-thirds came back.",claim_ids:["C1"]},{text:"Still, they stayed 5.6% below where they started, and 48.2% kept off at least 5%.",claim_ids:["C3","C4"]},{text:"chart: 0 → -17.3% (week 68) → -5.6% (week 120)",claim_ids:["C2","C3"]},{text:"After weight loss, the body triggers changes that push weight back up. Regain is common.",claim_ids:["C9"]},{text:"Here, lifestyle support stopped too, which the authors say may have added to the regain.",claim_ids:["C11"]},{text:"Keep checking sugar and BP",claim_ids:["C6","C7"]},{text:"In the STEP 1 extension, adults stopped a weekly weight-loss injection AND their lifestyle support at week 68.",claim_ids:["C1","C2"]},{text:"most participants were White adults in 5 high-income countries, and several authors work for the manufacturer.",claim_ids:["C13"]}],checks:{issues:[],passed:!0,verified_claims:14,dropped_claims:0}},slot:{date:"2026-10-22",time_ist:"19:00",paper:"step1-ext",format:"reel"}},{paper:"wyatt-dips",format:"static",files:["wyatt-dips/static/static_en_feed.png","wyatt-dips/static/static_en_square.png","wyatt-dips/static/static_en_story.png","wyatt-dips/static/static_hi_feed.png","wyatt-dips/static/static_hi_square.png","wyatt-dips/static/static_hi_story.png"],package:{format:"static",message:"That hunger 2–3 hours after a meal can be a blood-sugar dip, not a willpower problem.",reasoning:"Our audience blames themselves for the 4 pm snack attack. This large glucose-monitor study links the dip after a sugar spike to more hunger and more eating later — a body signal, not a character flaw. It reframes guilt into curiosity ('what did I eat at lunch?') without promising weight loss. We flag that it is an association, the effect is small, and 97% of participants were white.",en:{kicker:"the 4 pm hunger, explained",stat:"+312 kcal",headline:"That snack attack may be a *sugar dip*",support:"People whose blood sugar dipped most 2–3 hours after breakfast ate about 312 kcal more over the next 24 hours.",note:"a signal, not a failing"},hi:{kicker:"4 baje wali bhookh, samjho",stat:"+312 kcal",headline:"Woh snack craving shayad *sugar dip* hai",support:"Breakfast ke 2–3 ghante baad jinka blood sugar sabse zyada gira, unhone agle 24 ghante mein lagbhag 312 kcal zyada khaya.",note:"signal hai, kamzori nahi"},caption_en:"Ever feel starving at 4 pm even after a proper lunch? A study that put glucose monitors on 1070 adults found that a blood-sugar DIP 2–3 hours after eating predicted hunger and later eating better than the sugar spike itself. The biggest dippers ate about 312 kcal more over the next 24 hours.\n\nIn the study, the biggest dips came after the test meal with the biggest sugar spike (a glucose drink). Fair warning: this is an association, the effect is small, food was self-reported, and 97% of participants were white — Indian meals weren't tested. Hunger has many causes; this is one.\n\nSource: Wyatt et al., Nature Metabolism 2021 (doi:10.1038/s42255-021-00383-x)\nsteerclub.com",caption_hi:"Proper lunch ke baad bhi 4 baje zor ki bhookh? 1070 adults par glucose monitor lagakar ek study ne dekha ki khaane ke 2–3 ghante baad blood sugar ka GIRNA (dip) — spike se zyada — bhookh aur baad mein khaane ko predict karta hai. Sabse bade dip waale log agle 24 ghante mein lagbhag 312 kcal zyada khaaye.\n\nStudy mein sabse bade dip us test meal ke baad aaye jisme sugar spike sabse zyada tha (glucose drink). Dhyan rahe: ye association hai, effect chhota hai, khaana self-reported tha, aur 97% log white the — Indian khaana test nahi hua. Bhookh ke kai kaaran hain; ye unme se ek hai.\n\nSource: Wyatt et al., Nature Metabolism 2021 (doi:10.1038/s42255-021-00383-x)\nsteerclub.com",hashtags:["steerclub","bloodsugar","hungerpangs","4pmcravings","metabolichealth","sciencesimplified","indianhealth","mindfuleating","glucose","hinglish"],alt_text:"Cream card with a large terracotta '+312 kcal' and the headline 'That snack attack may be a sugar dip'. Supporting text: people whose blood sugar dipped most 2–3 hours after breakfast ate about 312 kcal more over the next 24 hours.",claim_map:[{text:"That snack attack may be a sugar dip",claim_ids:["C1"]},{text:"+312 kcal",claim_ids:["C2"]},{text:"People whose blood sugar dipped most 2–3 hours after breakfast ate about 312 kcal more over the next 24 hours.",claim_ids:["C2"]},{text:"A study that put glucose monitors on 1070 adults",claim_ids:["C4"]},{text:"a blood-sugar DIP 2–3 hours after eating predicted hunger and later eating better than the sugar spike itself",claim_ids:["C1"]},{text:"In the study, the biggest dips came after the test meal with the biggest sugar spike (a glucose drink).",claim_ids:["C6"]},{text:"the effect is small",claim_ids:["C9"]},{text:"97% of participants were white",claim_ids:["C10"]}],checks:{issues:[],passed:!0,verified_claims:11,dropped_claims:0}},slot:{date:"2026-10-24",time_ist:"13:00",paper:"wyatt-dips",format:"static"}},{paper:"misra-definition",format:"carousel",files:["misra-definition/carousel/carousel_en_01.png","misra-definition/carousel/carousel_en_02.png","misra-definition/carousel/carousel_en_03.png","misra-definition/carousel/carousel_en_04.png","misra-definition/carousel/carousel_en_05.png","misra-definition/carousel/carousel_en_06.png","misra-definition/carousel/carousel_en_07.png","misra-definition/carousel/carousel_en_08.png","misra-definition/carousel/carousel_hi_01.png","misra-definition/carousel/carousel_hi_02.png","misra-definition/carousel/carousel_hi_03.png","misra-definition/carousel/carousel_hi_04.png","misra-definition/carousel/carousel_hi_05.png","misra-definition/carousel/carousel_hi_06.png","misra-definition/carousel/carousel_hi_07.png","misra-definition/carousel/carousel_hi_08.png"],package:{format:"carousel",message:"India's new obesity definition looks beyond the scale: BMI above 23, your waist, and whether daily life or health is affected.",reasoning:"Our audience either thinks 'BMI 25 is fine' (Western cut-offs) or feels labelled by one number. The new Indian expert definition is empowering: Indian-specific cut-offs, a waist check anyone can do at home, and a staging that separates 'extra fat, no harm yet' (Stage 1, where lifestyle is usually enough) from 'it's affecting my body' (Stage 2, see a doctor). It moves the conversation from weight to health without promoting any drug.",en:{slides:[{type:"cover",kicker:"India's obesity definition, revised",headline:"Beyond the *scale*",sub:"Indian experts now look at BMI, your waist and your daily life together.",swipe:"swipe"},{type:"stat",kicker:"the Indian starting point",number:"BMI 23+",text:"For Asian Indians, extra body fat starts counting above a BMI of 23 kg/m².",note:"Indian-specific"},{type:"explain",kicker:"two stages, not one label",headline:"Stage 1 vs *Stage 2*",body:"Stage 1: BMI above 23, no effect yet on organs or daily life. Stage 2: BMI above 23 plus a high waist, with daily-life limits or a related disease.",note:""},{type:"myth",myth:"BMI tells you everything.",truth:"BMI can't tell muscle from fat. Asian Indians show more disease at smaller waist sizes."},{type:"habit",kicker:"check at home",headline:"Grab a *tape*",bullets:["Waist: 90 cm+ (men), 80 cm+ (women)","Waist ÷ height above 0.5? Take note","Breathless or leg-joint pain doing chores? Tell a doctor"]},{type:"explain",kicker:"the good news",headline:"Stage 1 is a *habits* stage",body:"For Stage 1, nutrition therapy, physical activity and behaviour change are usually enough.",note:"start small"},{type:"cta",headline:"Know your *stage*, not just your weight.",sub:"A steer doctor can check your numbers with you."}]},hi:{slides:[{type:"cover",kicker:"India ki obesity definition, nayi",headline:"Scale se *aage*",sub:"Indian experts ab BMI, kamar aur aapki daily life — teeno ek saath dekhte hain.",swipe:"swipe karo"},{type:"stat",kicker:"Indian starting point",number:"BMI 23+",text:"Asian Indians mein extra body fat BMI 23 kg/m² se upar se count hota hai.",note:"Indian-specific"},{type:"explain",kicker:"ek label nahi, do stage",headline:"Stage 1 vs *Stage 2*",body:"Stage 1: BMI 23 se upar, par organs ya daily life pe asar nahi. Stage 2: BMI 23 se upar + badi kamar, saath mein daily-life dikkat ya related bimari.",note:""},{type:"myth",myth:"BMI sab kuch bata deta hai.",truth:"BMI muscle aur fat mein farak nahi kar sakta. Asian Indians mein chhoti kamar pe bhi bimari zyada dikhti hai."},{type:"habit",kicker:"ghar pe check karo",headline:"*Tape* uthao",bullets:["Kamar: 90 cm+ (purush), 80 cm+ (mahila)","Kamar ÷ height 0.5 se upar? Note karo","Ghar ke kaam mein saans phoolna ya pairon ke jodon mein dard? Doctor ko batao"]},{type:"explain",kicker:"achhi khabar",headline:"Stage 1 = *habits* ka stage",body:"Stage 1 mein nutrition therapy, physical activity aur behaviour change aksar kaafi hote hain.",note:"chhote se shuru karo"},{type:"cta",headline:"Sirf weight nahi, apna *stage* jaano.",sub:"steer ke doctor aapke numbers aapke saath check kar sakte hain."}]},caption_en:"Think a 'normal-looking' BMI means you're fine? India's revised obesity definition looks closer. In a five-round Delphi consensus, Indian experts set BMI above 23 kg/m² as the starting point for Asian Indians — and added the waist (90 cm+ men, 80 cm+ women, or waist-to-height above 0.5).\n\nThey also split obesity into stages: Stage 1 (extra fat, no effect on organs or daily life — lifestyle is usually enough) and Stage 2 (plus daily-life limits like breathlessness or leg-joint pain, or a related disease). Note: this is expert consensus, not new trial data.\n\nSource: Misra et al., Diabetes Metab Syndr 2025 (doi:10.1016/j.dsx.2024.102989)\nsteerclub.com",caption_hi:"Lagta hai BMI 'theek-thaak' hai toh sab theek? India ki revised obesity definition zyada dhyan se dekhti hai. Paanch round ke Delphi consensus mein Indian experts ne Asian Indians ke liye BMI 23 kg/m² se upar ko starting point rakha — aur kamar bhi jodi (purush 90 cm+, mahila 80 cm+, ya kamar ÷ height 0.5 se upar).\n\nObesity ko stages mein baanta: Stage 1 (extra fat, organs ya daily life pe asar nahi — lifestyle aksar kaafi) aur Stage 2 (saath mein daily-life dikkat jaise saans phoolna ya jodon ka dard, ya related bimari). Dhyan rahe: ye expert consensus hai, naya trial data nahi.\n\nSource: Misra et al., Diabetes Metab Syndr 2025 (doi:10.1016/j.dsx.2024.102989)\nsteerclub.com",hashtags:["steerclub","metabolichealth","waistsize","bmi","indianhealth","obesityawareness","healthyhabits","sciencesimplified","doctorled","hinglish"],alt_text:"Eight-slide carousel on India's revised obesity definition: BMI above 23 as the starting point for Asian Indians, Stage 1 vs Stage 2, BMI can't tell muscle from fat, home waist check (90 cm men, 80 cm women, waist-to-height above 0.5), lifestyle usually enough for Stage 1, and an invitation to check numbers with a steer doctor.",claim_map:[{text:"For Asian Indians, extra body fat starts counting above a BMI of 23 kg/m².",claim_ids:["C2"]},{text:"Stage 1: BMI above 23, no effect yet on organs or daily life.",claim_ids:["C2"]},{text:"Stage 2: BMI above 23 plus a high waist, with daily-life limits or a related disease.",claim_ids:["C3","C4"]},{text:"BMI can't tell muscle from fat.",claim_ids:["C6"]},{text:"Asian Indians show more disease at smaller waist sizes.",claim_ids:["C8"]},{text:"Waist: 90 cm+ (men), 80 cm+ (women); Waist ÷ height above 0.5",claim_ids:["C5"]},{text:"Breathless or leg-joint pain doing chores? Tell a doctor",claim_ids:["C9"]},{text:"For Stage 1, nutrition therapy, physical activity and behaviour change are usually enough.",claim_ids:["C10"]},{text:"In a five-round Delphi consensus, Indian experts",claim_ids:["C12"]}],checks:{issues:[],passed:!0,verified_claims:11,dropped_claims:1}},slot:{date:"2026-10-25",time_ist:"19:00",paper:"misra-definition",format:"carousel"}}]},a="steer_review_"+(e&&e.generated),t={who:"",posts:{},claims:{}};try{t=JSON.parse(localStorage.getItem(a))||t}catch(e){}function i(){tr
